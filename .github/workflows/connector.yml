name: Connector uitrollen

# Zet de MCP-connector (supabase/functions/mcp) online zodra er iets aan
# verandert, zonder dat er ergens een terminal aan te pas komt. Met de knop
# "Run workflow" op GitHub kan het ook met de hand.
#
# Nodig: een Supabase access token als repository secret
# SUPABASE_ACCESS_TOKEN. Zonder dat token slaat deze workflow het uitrollen
# over in plaats van rood te kleuren.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/connector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector
  cancel-in-progress: true

env:
  PROJECT_REF: blcltrpmnhbasgxapfcz

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Token aanwezig?
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ontbreekt; de connector is niet uitgerold."
            echo "aanwezig=nee" >> "$GITHUB_OUTPUT"
          else
            echo "aanwezig=ja" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.aanwezig == 'ja'
        uses: actions/checkout@v4

      - if: steps.token.outputs.aanwezig == 'ja'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: Claude stuurt zijn eigen sleutel mee, geen
      # Supabase-token. Zie ook supabase/config.toml.
      - if: steps.token.outputs.aanwezig == 'ja'
        run: supabase functions deploy mcp --project-ref "$PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
