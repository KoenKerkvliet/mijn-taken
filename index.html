<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mijn-taken/favicon.svg" />
    <link rel="apple-touch-icon" href="/mijn-taken/apple-touch-icon.png" />

    <!-- viewport-fit=cover laat de app onder de notch en de thuisbalk door
         lopen; index.css vangt dat op met safe-area-insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Twee kleuren, anders is de statusbalk in donkere modus spierwit. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f16" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taken" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Mijn taken</title>

    <!-- Het thema wordt hier al gezet, voordat er iets getekend is. Deden we
         dat pas in React, dan flitst een donkere app eerst wit op. -->
    <script>
      try {
        var t = localStorage.getItem('mijn-taken:thema')
        document.documentElement.dataset.thema =
          t === 'licht' || t === 'donker' ? t : 'systeem'
      } catch (e) {
        document.documentElement.dataset.thema = 'systeem'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
